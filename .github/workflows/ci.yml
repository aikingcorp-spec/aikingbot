name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
      - run: node scripts/prepare.mjs
      - name: Core
        run: |
          cd packages/core
          npx tsc --noEmit
          bun test ./test
      - name: Desktop typecheck
        working-directory: apps/desktop
        run: |
          npx tsc -b
          npx tsc -p tsconfig.server.json --noEmit
      - name: Release gate
        run: node scripts/run-tests.mjs
      - name: Installer
        run: node scripts/build.mjs
      - name: Server bundle and smoke
        if: runner.os == 'Linux'
        run: |
          node scripts/server-bundle.mjs
          node scripts/server-smoke.mjs
