name: Windows local build

# Builds an unsigned Windows x64 installer of AIKINGBOT in local-only mode, uploads it as a workflow
# artifact, and publishes it as a prerelease. It needs no secrets: there is no code signing and no
# hosted service.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/optimistic-mendel-fn9411

concurrency:
  group: windows-local-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Build unsigned Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Run Windows checks
        run: bun run typecheck:node && bun run typecheck:renderer && bunx vitest run src/backend/cli.test.ts src/main/hosted-services.test.ts

      - name: Build NSIS installer
        shell: pwsh
        run: |
          bun run dist:win:local
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No installer was built." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AIKINGBOT-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30

  prerelease:
    name: Publish prerelease
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: AIKINGBOT-windows-x64
          path: assets

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: aikingbot-v0-local-${{ github.run_number }}
        run: |
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AIKINGBOT V0 local build ${{ github.run_number }}" \
            --notes "Unsigned Windows x64 test build in local-only mode, from ${GITHUB_SHA}. Windows SmartScreen will warn: choose More info, then Run anyway."
