# Host nginx vhost for AIKINGBOT (staging). Upstream:
#   Docker mode  -> 127.0.0.1:18080 (Caddy edge)
#   systemd mode -> 127.0.0.1:18799 (app) and /hooks/ -> 127.0.0.1:18800
# Certificates: reuse the host's existing certbot/ACME setup.
map $http_upgrade $aikingbot_connection { default upgrade; '' close; }
server {
    listen 443 ssl;
    http2 on;
    server_name bot-staging.example.com;
    ssl_certificate     /etc/letsencrypt/live/bot-staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot-staging.example.com/privkey.pem;
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Always overwrite: a client must not supply its own forwarding chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aikingbot_connection;
        proxy_buffering off;          # SSE
        proxy_read_timeout 3600s;     # Voice WebSocket, long SSE streams
        proxy_send_timeout 3600s;
    }
}
server {
    listen 80;
    server_name bot-staging.example.com;
    return 301 https://$host$request_uri;
}
